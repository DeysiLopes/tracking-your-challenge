name: Auto PR feature → develop

on:
  push:
    branches:
      - 'feature/**'

concurrency:
  group: auto-pr-feature-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create or update PR to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="develop"
          HEAD="${{ github.ref_name }}"

          if ! gh api repos/${{ github.repository }}/branches/$BASE --jq '.name' &>/dev/null; then
            echo "Branch '$BASE' does not exist. Skipping PR creation."
            exit 0
          fi

          TITLE="feat: $(echo "$HEAD" | sed 's|feature/||' | tr '-' ' ')"

          PR_NUMBER=$(gh pr list \
            --head "$HEAD" \
            --base "$BASE" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "PR #$PR_NUMBER already exists — updating title"
            gh pr edit "$PR_NUMBER" --title "$TITLE"
          else
            echo "Creating PR from $HEAD → $BASE"
            gh pr create \
              --base "$BASE" \
              --head "$HEAD" \
              --title "$TITLE" \
              --body "Auto-generated PR\n\n\`$HEAD\` → \`$BASE\`"
          fi